services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-copilot-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - copilot-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  copilot-data:
