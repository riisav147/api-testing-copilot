spring:
  application:
    name: api-testing-copilot
  profiles:
    default: demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: 127.0.0.1
  port: 8080
  tomcat:
    max-http-form-post-size: 128KB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
copilot:
  sandbox-port: ${server.port}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  database-url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/copilot}
  database-user: ${DATABASE_USER:copilot}
  database-password: ${DATABASE_PASSWORD:copilot-local}
